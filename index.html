<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porra Mundial - Departamento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .podium-1 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
        .podium-2 { background: linear-gradient(135deg, #e6e9f0 0%, #eef1f5 100%); }
        .podium-3 { background: linear-gradient(135deg, #f6d365 0%, #f6d365 100%); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r gold from-yellow-400 to-amber-500 mb-2">
                🏆 PORRA MUNDIAL
            </h1>
            <p class="text-gray-400 text-lg">Clasificación, apuestas y reparto del bote en tiempo real</p>
            
            <div class="inline-block mt-6 bg-gray-800 border border-gray-700 rounded-lg px-6 py-3 shadow-lg">
                <span class="text-gray-400 text-sm block uppercase tracking-wider">Bote Total Recaudado</span>
                <span id="bote-total" class="text-3xl font-black text-green-400">0 €</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md">
                    <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-amber-400">
                        ⚽ Podio Oficial
                    </h2>
                    <div id="podio-oficial" class="space-y-3">
                        </div>
                </div>

                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md">
                    <h2 class="text-xl font-bold mb-4 text-emerald-400">💰 Reparto de Premios</h2>
                    <div id="lista-premios" class="space-y-4">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-md overflow-hidden">
                    <div class="p-6 border-b border-gray-700 bg-gray-850">
                        <h2 class="text-xl font-bold text-blue-400">📋 Apuestas del Departamento</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-750 text-gray-400 uppercase text-xs tracking-wider border-b border-gray-700">
                                    <th class="py-4 px-6">Participante</th>
                                    <th class="py-4 px-3 text-center">1º (50%)</th>
                                    <th class="py-4 px-3 text-center">2º (25%)</th>
                                    <th class="py-4 px-3 text-center">3º (15%)</th>
                                    <th class="py-4 px-3 text-center">4º (10%)</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-participantes" class="divide-y divide-gray-700">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE LOS DATOS (EDITA AQUÍ)
        // ==========================================
        
        // El precio que paga cada uno por participar
        const PRECIO_INSCRIPCION = 5; 

        // Pon aquí los países según vayan quedando en el mundial real.
        // Si no se sabe aún, déjalos vacíos como "" para que no puntúe.
        // Ejemplo final: ["Argentina", "Francia", "Croacia", "Marruecos"]
        const RESULTADO_REAL = ["", "", "", ""]; 

        // Introduce aquí las apuestas de la oficina el día 1 de junio.
        const PARTICIPANTES = [
            { nombre: "Angel Manero", puestos: ["España", "Francia", "Brasil", "Portugal"] },
            { nombre: "Andres Periñan", puestos: ["Francia", "Argentina", "España", "Croacia"] },
            { nombre: "Alejandro Morente", puestos: ["España", "Inglaterra", "Japón", "Marruecos"] },
            { nombre: "Fernando Rodríguez", puestos: ["Francia", "España", "Argentina", "Inglaterra"] },
            { nombre: "Javier Jimenez-Castellanos", puestos: ["España", "Portugal", "Francia", "Inglaterra"] }
        ];

        // ==========================================
        // 2. MOTOR DE CÁLCULO Y RENDERIZADO
        // ==========================================
        
        function inicializarPorra() {
            const boteTotal = PARTICIPANTES.length * PRECIO_INSCRIPCION;
            document.getElementById('bote-total').innerText = `${boteTotal} €`;

            let porcentajes = [0.50, 0.25, 0.15, 0.10];
            let acertantesPorPosicion = [[], [], [], []];

            // Buscar acertantes
            PARTICIPANTES.forEach(p => {
                for (let i = 0; i < 4; i++) {
                    if (RESULTADO_REAL[i] && p.puestos[i].toLowerCase() === RESULTADO_REAL[i].toLowerCase()) {
                        acertantesPorPosicion[i].push(p.nombre);
                    }
                }
            });

            // Aplicar regla de redistribución hacia arriba si hay categorías vacías
            for (let i = 3; i > 0; i--) {
                if (RESULTADO_REAL[i] && acertantesPorPosicion[i].length === 0) {
                    let porcentajeAAgregar = porcentajes[i];
                    porcentajes[i] = 0;

                    let categoriasSuperioresConAcertantes = [];
                    for (let j = i - 1; j >= 0; j--) {
                        if (acertantesPorPosicion[j].length > 0) {
                            categoriasSuperioresConAcertantes.push(j);
                        }
                    }

                    if (categoriasSuperioresConAcertantes.length > 0) {
                        let sumaPorcentajesSuperiores = categoriasSuperioresConAcertantes.reduce((sum, idx) => sum + porcentajes[idx], 0);
                        categoriasSuperioresConAcertantes.forEach(idx => {
                            let proporcion = porcentajes[idx] / sumaPorcentajesSuperiores;
                            porcentajes[idx] += porcentajeAAgregar * proporcion;
                        });
                    } else {
                        porcentajes[i] = porcentajeAAgregar; // Se queda el remanente si no hay ningún acierto arriba
                    }
                }
            }

            // Renderizar Podio de control
            const nombresPuestos = ["1º Campeón", "2º Puesto", "3º Puesto", "4º Puesto"];
            const coloresPuestos = ["text-yellow-400", "text-gray-300", "text-amber-600", "text-amber-800"];
            let podioHTML = '';
            for (let i = 0; i < 4; i++) {
                podioHTML += `
                    <div class="flex items-center justify-between border-b border-gray-700 py-2 last:border-0">
                        <span class="font-medium ${coloresPuestos[i]}">${nombresPuestos[i]}:</span>
                        <span class="font-bold bg-gray-900 px-3 py-1 rounded border border-gray-700 text-sm">
                            ${RESULTADO_REAL[i] ? RESULTADO_REAL[i] : '⌛ Pendiente'}
                        </span>
                    </div>
                `;
            }
            document.getElementById('podio-oficial').innerHTML = podioHTML;

            // Renderizar Premios
            let premiosHTML = '';
            for (let i = 0; i < 4; i++) {
                let dineroCategoria = boteTotal * porcentajes[i];
                let numAcertantes = acertantesPorPosicion[i].length;
                let premioIndividual = numAcertantes > 0 ? dineroCategoria / numAcertantes : 0;

                premiosHTML += `
                    <div class="bg-gray-900 p-3 rounded-lg border border-gray-700">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-semibold text-gray-300">${nombresPuestos[i]}</span>
                            <span class="text-xs text-gray-400">Total Cat: ${dineroCategoria.toFixed(1)}€</span>
                        </div>
                        <div class="text-lg font-bold text-white mb-1">${premioIndividual.toFixed(2)} € <span class="text-xs font-normal text-gray-400">/ persona</span></div>
                        <div class="text-xs text-gray-400 truncate">
                            ${numAcertantes > 0 ? `🎯 ${acertantesPorPosicion[i].join(', ')}` : '❌ Sin acertantes'}
                        </div>
                    </div>
                `;
            }
            document.getElementById('lista-premios').innerHTML = premiosHTML;

            // Renderizar Tabla de posiciones
            let tablaHTML = '';
            PARTICIPANTES.forEach(p => {
                let celdasPuestos = '';
                for (let i = 0; i < 4; i++) {
                    let esAcierto = RESULTADO_REAL[i] && p.puestos[i].toLowerCase() === RESULTADO_REAL[i].toLowerCase();
                    let claseFondo = esAcierto ? 'bg-green-950 text-green-300 font-bold border border-green-700' : 'bg-gray-900 text-gray-300';
                    celdasPuestos += `<td class="py-3 px-2 text-center text-sm"><span class="inline-block w-full py-1 rounded ${claseFondo}">${p.puestos[i]}</span></td>`;
                }

                tablaHTML += `
                    <tr class="hover:bg-gray-750 transition-colors">
                        <td class="py-4 px-6 font-semibold text-white border-r border-gray-700">${p.nombre}</td>
                        ${celdasPuestos}
                    </tr>
                `;
            });
            document.getElementById('tabla-participantes').innerHTML = tablaHTML;
        }

        // Ejecutar al cargar la página
        window.onload = inicializarPorra;
    </script>
</body>
</html>
